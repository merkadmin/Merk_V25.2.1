<app-regular-action-card-top></app-regular-action-card-top>
<div class="post d-flex flex-column-fluid" id="kt_post">
	<div id="kt_content_container" class="container-xxl">
		<div class="d-flex flex-column flex-lg-row">
			<div class="flex-lg-row-fluid mb-10 mb-lg-0 me-lg-7 me-xl-10">
				<div class="card">
					<div class="card-body p-12">
						<form action="" id="kt_invoice_form">
							<div class="d-flex flex-column align-items-start flex-xxl-row">
								<div class="d-flex align-items-center flex-equal fw-row me-4 order-2"
									data-bs-toggle="tooltip" data-bs-trigger="hover" title="Specify invoice date">
									<div class="fs-6 fw-bolder text-gray-700 text-nowrap">Date:</div>
									<div class="position-relative d-flex align-items-center w-150px">
										<input class="form-control form-control-white fw-bolder pe-5"
											placeholder="Select date" name="invoice_date" />
										<span class="svg-icon svg-icon-2 position-absolute ms-4 end-0">
											<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
												viewBox="0 0 24 24" fill="none">
												<path
													d="M11.4343 12.7344L7.25 8.55005C6.83579 8.13583 6.16421 8.13584 5.75 8.55005C5.33579 8.96426 5.33579 9.63583 5.75 10.05L11.2929 15.5929C11.6834 15.9835 12.3166 15.9835 12.7071 15.5929L18.25 10.05C18.6642 9.63584 18.6642 8.96426 18.25 8.55005C17.8358 8.13584 17.1642 8.13584 16.75 8.55005L12.5657 12.7344C12.2533 13.0468 11.7467 13.0468 11.4343 12.7344Z"
													fill="black" />
											</svg>
										</span>
									</div>
								</div>
								<div class="d-flex flex-center flex-equal fw-row text-nowrap order-1 order-xxl-2 me-4"
									data-bs-toggle="tooltip" data-bs-trigger="hover" title="Enter invoice number">
									<span class="fs-2x fw-bolder text-gray-800">Invoice #</span>
									<input type="text"
										class="form-control form-control-flush fw-bolder text-muted fs-3 w-125px"
										value="2021001" placehoder="..." />
								</div>
								<div class="d-flex align-items-center justify-content-end flex-equal order-3 fw-row"
									data-bs-toggle="tooltip" data-bs-trigger="hover" title="Specify invoice due date">
									<div class="fs-6 fw-bolder text-gray-700 text-nowrap">Due Date:</div>
									<div class="position-relative d-flex align-items-center w-150px">
										<input class="form-control form-control-white fw-bolder pe-5"
											placeholder="Select date" name="invoice_due_date" />
										<span class="svg-icon svg-icon-2 position-absolute end-0 ms-4">
											<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
												viewBox="0 0 24 24" fill="none">
												<path
													d="M11.4343 12.7344L7.25 8.55005C6.83579 8.13583 6.16421 8.13584 5.75 8.55005C5.33579 8.96426 5.33579 9.63583 5.75 10.05L11.2929 15.5929C11.6834 15.9835 12.3166 15.9835 12.7071 15.5929L18.25 10.05C18.6642 9.63584 18.6642 8.96426 18.25 8.55005C17.8358 8.13584 17.1642 8.13584 16.75 8.55005L12.5657 12.7344C12.2533 13.0468 11.7467 13.0468 11.4343 12.7344Z"
													fill="black" />
											</svg>
										</span>
									</div>
								</div>
							</div>
							<div class="separator separator-dashed my-10"></div>
							<div class="mb-0">
								<div class="row gx-10 mb-5">
									<div class="col-lg-6">
										<label class="form-label fs-6 fw-bolder text-gray-700 mb-3">Bill
											From</label>
										<div class="mb-5">
											<input type="text" class="form-control form-control-solid"
												placeholder="Name" />
										</div>
										<div class="mb-5">
											<input type="text" class="form-control form-control-solid"
												placeholder="Email" />
										</div>
										<div class="mb-5">
											<textarea name="notes" class="form-control form-control-solid" rows="3"
												placeholder="Who is this invoice from?"></textarea>
										</div>
									</div>
									<div class="col-lg-6">
										<label class="form-label fs-6 fw-bolder text-gray-700 mb-3">Bill To</label>
										<div class="mb-5">
											<input type="text" class="form-control form-control-solid"
												placeholder="Name" />
										</div>
										<div class="mb-5">
											<input type="text" class="form-control form-control-solid"
												placeholder="Email" />
										</div>
										<div class="mb-5">
											<textarea name="notes" class="form-control form-control-solid" rows="3"
												placeholder="What is this invoice for?"></textarea>
										</div>
									</div>
								</div>
								<div class="table-responsive mb-10">
									<!--begin::Table-->
									<table class="table g-5 gs-0 mb-0 fw-bolder text-gray-700" data-kt-element="items">
										<!--begin::Table head-->
										<thead>
											<tr class="border-bottom fs-7 fw-bolder text-gray-700 text-uppercase">
												<th class="min-w-300px w-475px">Item</th>
												<th class="min-w-100px w-100px">QTY</th>
												<th class="min-w-150px w-150px">Price</th>
												<th class="min-w-100px w-150px text-end">Total</th>
												<th class="min-w-75px w-75px text-end">Action</th>
											</tr>
										</thead>
										<!--end::Table head-->
										<!--begin::Table body-->
										<tbody>
											<tr class="border-bottom border-bottom-dashed" data-kt-element="item">
												<td class="pe-7">
													<input type="text" class="form-control form-control-solid mb-2"
														name="name[]" placeholder="Item name" />
													<input type="text" class="form-control form-control-solid"
														name="description[]" placeholder="Description" />
												</td>
												<td class="ps-0">
													<input class="form-control form-control-solid" type="number" min="1"
														name="quantity[]" placeholder="1" value="1"
														data-kt-element="quantity" />
												</td>
												<td>
													<input type="text" class="form-control form-control-solid text-end"
														name="price[]" placeholder="0.00" value="0.00"
														data-kt-element="price" />
												</td>
												<td class="pt-8 text-end text-nowrap">$
													<span data-kt-element="total">0.00</span>
												</td>
												<td class="pt-5 text-end">
													<button type="button"
														class="btn btn-sm btn-icon btn-active-color-primary"
														data-kt-element="remove-item">
														<!--begin::Svg Icon | path: icons/duotune/general/gen027.svg-->
														<span class="svg-icon svg-icon-3">
															<svg xmlns="http://www.w3.org/2000/svg" width="24"
																height="24" viewBox="0 0 24 24" fill="none">
																<path
																	d="M5 9C5 8.44772 5.44772 8 6 8H18C18.5523 8 19 8.44772 19 9V18C19 19.6569 17.6569 21 16 21H8C6.34315 21 5 19.6569 5 18V9Z"
																	fill="black" />
																<path opacity="0.5"
																	d="M5 5C5 4.44772 5.44772 4 6 4H18C18.5523 4 19 4.44772 19 5V5C19 5.55228 18.5523 6 18 6H6C5.44772 6 5 5.55228 5 5V5Z"
																	fill="black" />
																<path opacity="0.5"
																	d="M9 4C9 3.44772 9.44772 3 10 3H14C14.5523 3 15 3.44772 15 4V4H9V4Z"
																	fill="black" />
															</svg>
														</span>
														<!--end::Svg Icon-->
													</button>
												</td>
											</tr>
										</tbody>
										<!--end::Table body-->
										<!--begin::Table foot-->
										<tfoot>
											<tr
												class="border-top border-top-dashed align-top fs-6 fw-bolder text-gray-700">
												<th class="text-primary">
													<button class="btn btn-link py-1" data-kt-element="add-item">Add
														item</button>
												</th>
												<th colspan="2" class="border-bottom border-bottom-dashed ps-0">
													<div class="d-flex flex-column align-items-start">
														<div class="fs-5">Subtotal</div>
														<button class="btn btn-link py-1" data-bs-toggle="tooltip"
															data-bs-trigger="hover" title="Coming soon">Add
															tax</button>
														<button class="btn btn-link py-1" data-bs-toggle="tooltip"
															data-bs-trigger="hover" title="Coming soon">Add
															discount</button>
													</div>
												</th>
												<th colspan="2" class="border-bottom border-bottom-dashed text-end">
													$
													<span data-kt-element="sub-total">0.00</span>
												</th>
											</tr>
											<tr class="align-top fw-bolder text-gray-700">
												<th></th>
												<th colspan="2" class="fs-4 ps-0">Total</th>
												<th colspan="2" class="text-end fs-4 text-nowrap">$
													<span data-kt-element="grand-total">0.00</span>
												</th>
											</tr>
										</tfoot>
										<!--end::Table foot-->
									</table>
								</div>
								<!--end::Table-->
								<!--begin::Item template-->
								<table class="table d-none" data-kt-element="item-template">
									<tr class="border-bottom border-bottom-dashed" data-kt-element="item">
										<td class="pe-7">
											<input type="text" class="form-control form-control-solid mb-2"
												name="name[]" placeholder="Item name" />
											<input type="text" class="form-control form-control-solid"
												name="description[]" placeholder="Description" />
										</td>
										<td class="ps-0">
											<input class="form-control form-control-solid" type="number" min="1"
												name="quantity[]" placeholder="1" data-kt-element="quantity" />
										</td>
										<td>
											<input type="text" class="form-control form-control-solid text-end"
												name="price[]" placeholder="0.00" data-kt-element="price" />
										</td>
										<td class="pt-8 text-end">$
											<span data-kt-element="total">0.00</span>
										</td>
										<td class="pt-5 text-end">
											<button type="button" class="btn btn-sm btn-icon btn-active-color-primary"
												data-kt-element="remove-item">
												<!--begin::Svg Icon | path: icons/duotune/general/gen027.svg-->
												<span class="svg-icon svg-icon-3">
													<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
														viewBox="0 0 24 24" fill="none">
														<path
															d="M5 9C5 8.44772 5.44772 8 6 8H18C18.5523 8 19 8.44772 19 9V18C19 19.6569 17.6569 21 16 21H8C6.34315 21 5 19.6569 5 18V9Z"
															fill="black" />
														<path opacity="0.5"
															d="M5 5C5 4.44772 5.44772 4 6 4H18C18.5523 4 19 4.44772 19 5V5C19 5.55228 18.5523 6 18 6H6C5.44772 6 5 5.55228 5 5V5Z"
															fill="black" />
														<path opacity="0.5"
															d="M9 4C9 3.44772 9.44772 3 10 3H14C14.5523 3 15 3.44772 15 4V4H9V4Z"
															fill="black" />
													</svg>
												</span>
												<!--end::Svg Icon-->
											</button>
										</td>
									</tr>
								</table>
								<table class="table d-none" data-kt-element="empty-template">
									<tr data-kt-element="empty">
										<th colspan="5" class="text-muted text-center py-10">No items</th>
									</tr>
								</table>
								<!--end::Item template-->
								<!--begin::Notes-->
								<div class="mb-0">
									<label class="form-label fs-6 fw-bolder text-gray-700">Notes</label>
									<textarea name="notes" class="form-control form-control-solid" rows="3"
										placeholder="Thanks for your business"></textarea>
								</div>
								<!--end::Notes-->
							</div>
							<!--end::Wrapper-->
						</form>
						<!--end::Form-->
					</div>
					<!--end::Card body-->
				</div>
			</div>
		</div>
	</div>
</div>
